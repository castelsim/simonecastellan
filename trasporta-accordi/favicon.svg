<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Due accordi e una freccia: quello che fa la pagina, in un quadrato.
       Stesso fondo scuro e stesso raggio degli altri strumenti del sito. -->
  <rect width="64" height="64" rx="14" fill="#1a1a1a"/>
  <g fill="#ffffff">
    <!-- l'accordo di partenza, tre note in colonna -->
    <circle cx="17" cy="42" r="5"/>
    <circle cx="17" cy="30" r="5"/>
    <circle cx="17" cy="18" r="5"/>
    <!-- la freccia che porta più in alto -->
    <path d="M27 34 h11 l-4 -5 3 -2.5 8.5 9 -8.5 9 -3 -2.5 4 -5 h-11 z"/>
  </g>
  <!-- l'accordo di arrivo, la stessa forma spostata in su -->
  <g fill="#14b8a6">
    <circle cx="53" cy="34" r="5"/>
    <circle cx="53" cy="22" r="5"/>
    <circle cx="53" cy="10" r="5"/>
  </g>
</svg>
