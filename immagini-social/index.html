<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Dall'11 agosto 2026 questo strumento vive dentro «Posso pubblicarlo?».
       Erano le due metà dello stesso gesto — il responso diceva che una foto
       verrà tagliata, e la cura stava in un'altra pagina, dove bisognava
       ricaricare lo stesso file a mano.

       La pagina resta qui per i link e i segnalibri di prima: rimanda, dichiara
       il canonical e lo dice anche a parole, per chi ha il rinvio automatico
       disattivato. -->
  <title>Immagini per i social — ora dentro «Posso pubblicarlo?»</title>
  <meta name="robots" content="noindex, follow" />
  <link rel="canonical" href="https://simonecastellan.com/posso-pubblicarlo/" />
  <!-- Il rinvio è relativo: così vale anche in prova, sul server locale.  Il
       canonical qui sopra resta assoluto, che è quello che vuole Google. -->
  <meta http-equiv="refresh" content="0; url=/posso-pubblicarlo/" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" href="/posso-pubblicarlo/favicon.svg" type="image/svg+xml" />

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #fff; color: #3c4043; margin: 0;
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center; padding: 24px;
    }
    h1 { font-size: 22px; font-weight: 500; color: #1a1a1a; margin: 0 0 12px; }
    p { font-size: 15px; line-height: 1.6; margin: 0 0 20px; max-width: 30em; }
    a.vai {
      display: inline-block; background: #1a1a1a; color: #fff; text-decoration: none;
      font-size: 15px; font-weight: 600; padding: 12px 22px; border-radius: 999px;
    }
  </style>
</head>
<body>
  <h1>Si è trasferito</h1>
  <p>Preparare le immagini per i social ora si fa dentro <b>Posso pubblicarlo?</b>, insieme al
    controllo: carichi la foto una volta sola, ti dice dove verrebbe tagliata e la ritagli lì.</p>
  <p><a class="vai" href="/posso-pubblicarlo/">Vai allo strumento</a></p>
</body>
</html>
