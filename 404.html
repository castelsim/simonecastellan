<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagina non trovata — Simone Castellan</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#ffffff">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
          background:#fff; color:#3c4043; display:flex; flex-direction:column;
          align-items:center; justify-content:center; min-height:100vh; padding:24px; text-align:center; }
    h1{ font-size:23px; font-weight:400; color:#3c4043; margin-bottom:10px; }
    p{ font-size:15px; color:#5f6368; max-width:460px; line-height:1.6; }
    .links{ margin-top:26px; display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
    .links a{ background:#f1f3f4; border-radius:999px; padding:10px 17px; font-size:14px;
              font-weight:600; color:#1a1a1a; text-decoration:none; transition:background .15s ease; }
    .links a:hover{ background:#e6e8ea }
  </style>
</head>
<body>
  <h1>Questa pagina non esiste.</h1>
  <p>L'indirizzo che hai aperto non corrisponde a nessuna pagina del sito. Da qui puoi ripartire.</p>
  <div class="links">
    <a href="/">Home</a>
    <a href="/profilo/">Profilo</a>
    <a href="/cv/">Curriculum</a>
    <a href="/en/profile/">English</a>
  </div>
</body>
</html>
